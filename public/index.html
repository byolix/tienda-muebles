<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo de Muebles</title>
<link rel="stylesheet" href="/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="brand">Catálogo<em>·</em>Muebles</span>
      <nav class="cats" id="cats"></nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Muebles para vivir mejor, listos para hoy.</h1>
      <p>Cada pieza sigue disponible hasta que se marca como vendida — el catálogo se actualiza solo, directo desde nuestras fotos.</p>
    </div>
  </section>

  <main class="wrap">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Todavía no hay productos publicados. Vuelve pronto.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>¿Buscas algo específico? <a id="footer-whatsapp" href="#">Escríbenos por WhatsApp</a></p>
    </div>
  </footer>

<script src="/app.js"></script>
</body>
</html>
